<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YGodex - Pokédex Yu-Gi-Oh!</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #1a1d27;
    --panel2: #232734;
    --accent: #e8b923;
    --accent2: #4a9eff;
    --text: #e6e6e6;
    --muted: #8a8f9e;
    --border: #2e3342;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 20px 30px;
    background: linear-gradient(90deg, #1a1d27, #232734);
    border-bottom: 2px solid var(--accent);
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 1.6em;
    color: var(--accent);
    letter-spacing: 1px;
  }
  header .sub { color: var(--muted); font-size: 0.85em; }

  .search-bar {
    padding: 20px 30px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .search-bar input {
    flex: 1;
    min-width: 250px;
    padding: 12px 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 1em;
  }
  .search-bar input:focus { outline: 2px solid var(--accent2); }
  .search-bar button {
    padding: 12px 24px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #111;
    font-weight: bold;
    cursor: pointer;
    font-size: 1em;
  }
  .search-bar button:hover { background: #f5cc4a; }

  .tags-filter {
    padding: 0 30px 15px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .tag-pill {
    padding: 6px 14px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.85em;
    transition: all 0.15s;
  }
  .tag-pill:hover { border-color: var(--accent2); }
  .tag-pill.active {
    background: var(--accent2);
    color: #fff;
    border-color: var(--accent2);
  }

  .results {
    padding: 0 30px 30px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .card-tile {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .card-tile:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
  }
  .card-tile img {
    width: 80px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .card-tile .info { flex: 1; min-width: 0; }
  .card-tile .name {
    font-weight: bold;
    color: var(--accent);
    margin-bottom: 4px;
    font-size: 0.95em;
  }
  .card-tile .type {
    font-size: 0.75em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .card-tile .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .card-tile .tags span {
    font-size: 0.65em;
    padding: 2px 8px;
    background: var(--panel2);
    border-radius: 10px;
    color: var(--accent2);
    border: 1px solid var(--border);
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 100;
    overflow-y: auto;
    padding: 30px 15px;
  }
  .modal-overlay.open { display: block; }
  .modal {
    max-width: 900px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 16px;
    padding: 30px;
    position: relative;
  }
  .modal-close {
    position: absolute;
    top: 15px; right: 20px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.8em;
    cursor: pointer;
  }
  .modal-close:hover { color: var(--accent); }

  .modal-header {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .modal-header img {
    width: 180px;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .modal-header .hinfo { flex: 1; min-width: 250px; }
  .modal-header h2 {
    color: var(--accent);
    font-size: 1.5em;
    margin-bottom: 8px;
  }
  .stat-row {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin: 10px 0;
    font-size: 0.9em;
  }
  .stat-row span { color: var(--muted); }
  .stat-row b { color: var(--text); }

  .section {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .section h3 {
    color: var(--accent2);
    font-size: 1em;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .card-text {
    background: var(--panel2);
    padding: 15px;
    border-radius: 8px;
    font-style: italic;
    line-height: 1.6;
    font-size: 0.9em;
  }
  .tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag-list .tag-pill { cursor: default; }
  .tag-list .tag-pill.functional {
    background: rgba(74, 158, 255, 0.15);
    border-color: var(--accent2);
    color: var(--accent2);
  }
  .tag-list .tag-pill.format {
    background: rgba(232, 185, 35, 0.15);
    border-color: var(--accent);
    color: var(--accent);
  }
  .play-advice {
    background: var(--panel2);
    padding: 15px;
    border-radius: 8px;
    line-height: 1.6;
    font-size: 0.9em;
    border-left: 3px solid var(--accent);
  }
  .loading {
    text-align: center;
    padding: 40px;
    color: var(--muted);
  }
  .spinner {
    display: inline-block;
    width: 30px; height: 30px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: #ff6b6b; padding: 20px; text-align: center; }

  /* Info banner */
  .banner {
    margin: 0 30px 15px;
    padding: 10px 15px;
    background: rgba(74, 158, 255, 0.1);
    border-left: 3px solid var(--accent2);
    border-radius: 6px;
    font-size: 0.85em;
    color: var(--muted);
  }
  .banner b { color: var(--accent2); }

  .search-bar select{padding:12px 16px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1em;max-width:260px}
  .search-bar select:focus{outline:2px solid var(--accent2)}
  .count{padding:0 30px 12px;color:var(--muted);font-size:.85em}
  .more{display:block;margin:0 auto 40px;padding:12px 28px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1em;cursor:pointer}
  .more:hover{border-color:var(--accent)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px}
  .tag-list .tag-pill.syn{cursor:pointer}
  .tag-list .tag-pill.syn:hover{border-color:var(--accent)}
  .card-text{white-space:pre-line}
  .combo{margin-bottom:12px}.combo ol{padding-left:22px;line-height:1.6;font-size:.9em}
</style>
</head>
<body>

<header>
  <div>
    <h1>🎴 YGodex</h1>
    <div class="sub">Pokédex Yu-Gi-Oh! — données YGOPRODeck + Yugipedia + tags stratégiques</div>
  </div>
</header>

<div class="search-bar">
  <input id="searchInput" type="text" placeholder="Rechercher une carte... (ex: Ash Blossom)" />
  <select id="archSelect"><option value="">Tous les archétypes</option></select>
</div>

<div class="tags-filter" id="tagFilter"></div>
<div class="count" id="count">Chargement…</div>

<div class="results" id="results"></div>
<button class="more" id="more" hidden>Afficher plus</button>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const PAGE=60;
let BY={},ALL=[],list=[],shown=PAGE,currentFilter=null;
const nameOf=c=>c.name.fr||c.name.en;
const small=u=>u?u.replace('/images/cards/','/images/cards_small/'):'';

async function init(){
  try{
    const r=await fetch('data/pokedex-db.json');
    if(!r.ok)throw new Error('HTTP '+r.status);
    BY=(await r.json()).cards;ALL=Object.values(BY);
  }catch(e){
    $('count').textContent='';
    $('results').innerHTML='<div class="error" style="grid-column:1/-1;">Données introuvables : <code>data/pokedex-db.json</code> n\'existe pas encore.<br>Lance l\'Action « Build pokedex-db » (onglet Actions du dépôt), puis recharge la page.</div>';
    return;
  }
  const arch={};ALL.forEach(c=>{if(c.archetype)arch[c.archetype]=(arch[c.archetype]||0)+1});
  Object.keys(arch).sort((a,b)=>a.localeCompare(b)).forEach(a=>$('archSelect').add(new Option(a+' ('+arch[a]+')',a)));
  const tags=[...new Set(ALL.flatMap(c=>c.tags))].sort();
  $('tagFilter').innerHTML=tags.map(t=>`<div class="tag-pill" data-tag="${esc(t)}">${esc(t)}</div>`).join('');
  document.querySelectorAll('.tag-pill[data-tag]').forEach(el=>el.addEventListener('click',()=>{
    const t=el.dataset.tag;
    document.querySelectorAll('.tag-pill[data-tag]').forEach(p=>p.classList.remove('active'));
    if(currentFilter===t)currentFilter=null;else{currentFilter=t;el.classList.add('active')}
    shown=PAGE;render();
  }));
  $('searchInput').addEventListener('input',()=>{shown=PAGE;render()});
  $('archSelect').addEventListener('change',()=>{shown=PAGE;render()});
  $('more').onclick=()=>{shown+=PAGE;draw()};
  $('results').addEventListener('click',e=>{const t=e.target.closest('.card-tile');if(t)openCard(t.dataset.id)});
  render();
}

function render(){
  const q=norm($('searchInput').value.trim()),a=$('archSelect').value;
  list=ALL.filter(c=>(!a||c.archetype===a)&&(!currentFilter||c.tags.includes(currentFilter))
    &&(!q||norm(c.name.en).includes(q)||norm(c.name.fr).includes(q)));
  list.sort((x,y)=>(y.noted-x.noted)||nameOf(x).localeCompare(nameOf(y)));
  draw();
}
function draw(){
  $('count').textContent=list.length+' carte'+(list.length>1?'s':'');
  $('results').innerHTML=list.slice(0,shown).map(c=>{
    const th=c.tags.map(t=>`<span>${esc(t)}</span>`).join('')||'<span style="color:#555;border:none;background:none;">pas de tags</span>';
    return `<div class="card-tile" data-id="${c.id}">
      <img src="${esc(small(c.imgFull||c.img))}" alt="${esc(nameOf(c))}" loading="lazy">
      <div class="info"><div class="name">${c.noted?'<span class="dot" title="Fiche disponible"></span>':''}${esc(nameOf(c))}</div>
      <div class="type">${esc(c.type)}</div><div class="tags">${th}</div></div></div>`;
  }).join('')||'<div class="error" style="grid-column:1/-1;">Aucune carte trouvée.</div>';
  $('more').hidden=shown>=list.length;
}

function openCard(id){
  const c=BY[id];if(!c)return;
  const pills=(a,cls)=>a.map(t=>`<span class="tag-pill ${cls||''}">${esc(t)}</span>`).join('');
  const syn=c.synergies.filter(s=>BY[s]).map(s=>`<span class="tag-pill syn" data-open="${s}">${esc(nameOf(BY[s]))}</span>`).join('');
  const mod=$('modalContent');
  mod.innerHTML=`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-header">
      <img src="${esc(c.imgFull||c.img)}" alt="${esc(nameOf(c))}">
      <div class="hinfo">
        <h2>${esc(nameOf(c))}</h2>
        <div class="stat-row">
          <span>Type: <b>${esc(c.type)}</b></span>
          ${c.attribute?`<span>Attr: <b>${esc(c.attribute)}</b></span>`:''}
          ${c.level?`<span>Niv: <b>${c.level}</b></span>`:''}
          ${c.atk!=null?`<span>ATK: <b>${c.atk}</b></span>`:''}
          ${c.def!=null?`<span>DEF: <b>${c.def}</b></span>`:''}
        </div>
        ${c.archetype?`<div style="color:var(--muted);font-size:0.85em;">Archétype: ${esc(c.archetype)}</div>`:''}
      </div>
    </div>
    <div class="section"><h3>📜 Texte de la carte</h3><div class="card-text">${esc(c.desc.fr||c.desc.en||'—')}</div></div>
    <div class="section"><h3>🏷️ Tags</h3><div class="tag-list">${pills(c.tags,'functional')||'<span style="color:var(--muted);">Aucun tag pour cette carte.</span>'}</div></div>
    <div class="section"><h3>🎯 Comment la jouer</h3><div class="play-advice">${esc(c.howToPlay||'Pas encore de description stratégique.')}</div></div>
    ${c.combos.length?`<div class="section"><h3>⚔️ Combos</h3>${c.combos.map(k=>`<div class="combo"><b>${esc(k.title)}</b><ol>${k.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`).join('')}</div>`:''}
    <div class="section"><h3>🔗 Synergies & cartes liées</h3>${syn?`<div class="tag-list">${syn}</div>`:'<span style="color:var(--muted);">Aucune synergie renseignée.</span>'}</div>
    ${c.supports.length?`<div class="section"><h3>🧩 Supporte</h3><div class="tag-list">${pills(c.supports.slice(0,15))}</div></div>`:''}
    <div class="section"><h3>📊 Données</h3><div style="font-size:0.8em;color:var(--muted);line-height:1.7;">
      Passcode: ${c.id}${c.tcgStatus?` · Statut TCG: ${esc(c.tcgStatus)}`:''}${c.ocgStatus?` · Statut OCG: ${esc(c.ocgStatus)}`:''}
      ${c.effectTypes.length?`<br>Types d'effet: ${esc(c.effectTypes.join(', '))}`:''}</div></div>`;
  $('modalOverlay').classList.add('open');
}
function closeModal(){$('modalOverlay').classList.remove('open')}
$('modalOverlay').addEventListener('click',e=>{
  const o=e.target.closest('[data-open]');
  if(o)openCard(o.dataset.open);else if(e.target.id==='modalOverlay')closeModal();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
init();
</script>
</body>
</html>
