<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YGodex · La base de connaissance Yu-Gi-Oh!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e15;--bg2:#10141e;--panel:#161b28;--panel2:#1d2333;--line:#272e42;--gold:#e8b923;--gold2:#f6d56a;--blue:#4a9eff;--text:#e8eaf0;--muted:#8b93a8;--r:12px}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:150px}
body{font:15px/1.55 Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(1200px 500px at 50% -200px,#1b2440 0,transparent 70%),var(--bg);min-height:100vh}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:Cinzel,serif}
.hero{max-width:1280px;margin:0 auto;padding:44px 28px 26px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.hero h1{font-size:clamp(2.2rem,5vw,3.4rem);font-weight:900;letter-spacing:2px;background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,#b88a0c);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin-top:4px;max-width:520px}
.stats{display:flex;gap:26px}
.stats div{text-align:right}.stats b{display:block;font:700 1.7rem Cinzel;color:var(--text)}.stats span{color:var(--muted);font-size:.8rem}
.bar{position:sticky;top:0;z-index:20;background:rgba(11,14,21,.88);backdrop-filter:blur(12px);border-block:1px solid var(--line)}
.bar-in{max-width:1280px;margin:0 auto;padding:14px 28px;display:grid;grid-template-columns:1fr auto auto auto auto;gap:10px}
.field{position:relative}
.field svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;color:var(--muted)}
input[type=search],select{width:100%;height:44px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;padding:0 14px}
input[type=search]{padding-left:42px}
select{min-width:150px;cursor:pointer}
input:focus,select:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(74,158,255,.2)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--muted);padding:0 14px;font:600 .85rem Inter;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--gold);color:#17120a}
.tagrow{max-width:1280px;margin:0 auto;padding:0 28px 12px;display:flex;gap:7px;flex-wrap:wrap}
.pill{font:500 .82rem Inter;padding:5px 13px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;transition:.15s}
.pill:hover{border-color:var(--blue)}.pill[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06101e}
.pill i{font-style:normal;color:var(--muted);margin-left:5px}.pill[aria-pressed=true] i{color:#06101e99}
main{max-width:1280px;margin:0 auto;padding:22px 28px 60px}
.count{color:var(--muted);margin-bottom:16px;font-size:.88rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:20px 16px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:block;position:relative;border-radius:var(--r)}
.art{aspect-ratio:59/86;border-radius:8px;overflow:hidden;background:var(--panel2);box-shadow:0 6px 18px rgba(0,0,0,.45);transition:transform .2s,box-shadow .2s;position:relative}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.tile:hover .art,.tile:focus-visible .art{transform:translateY(-5px);box-shadow:0 14px 28px rgba(0,0,0,.6),0 0 0 2px var(--c,var(--gold))}
.tile.noted .art{box-shadow:0 6px 18px rgba(0,0,0,.45),0 0 0 2px var(--gold)}
.star{position:absolute;top:7px;right:7px;background:var(--gold);color:#17120a;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;box-shadow:0 2px 8px #0008}
.tile b{display:block;margin-top:9px;font:600 .9rem/1.25 Inter}
.tile small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.76rem;margin-top:3px}
.tile small::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.sk{aspect-ratio:59/86;border-radius:8px;background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 50%,var(--panel) 75%);background-size:200%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.more{display:block;margin:34px auto 0;padding:12px 30px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:600 .95rem Inter;cursor:pointer}
.more:hover{border-color:var(--gold);color:var(--gold2)}
.msg{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted)}
.msg h2{color:var(--text);margin-bottom:6px}
/* Modal */
dialog{border:0;padding:0;background:none;max-width:980px;width:calc(100% - 20px);max-height:94vh;color:var(--text);overflow:visible;margin:auto}
dialog::backdrop{background:rgba(4,6,12,.8);backdrop-filter:blur(4px)}
.m{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c,var(--gold));border-radius:16px;display:grid;grid-template-columns:300px 1fr;max-height:92vh;overflow:hidden;position:relative}
.side{padding:24px;background:linear-gradient(180deg,var(--panel2),var(--panel));overflow:auto}
.side img{width:100%;border-radius:8px;box-shadow:0 10px 30px #000a}
.facts{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.facts div{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.facts span{display:block;color:var(--muted);font-size:.72rem}.facts b{font-size:.95rem}
.body{padding:26px 28px;overflow:auto}
.body h2{font-size:1.7rem;font-weight:700;padding-right:36px}
.sub{color:var(--muted);margin:2px 0 14px}
.x{position:absolute;top:12px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg2);color:var(--muted);font-size:1rem;cursor:pointer;z-index:2}
.x:hover{color:var(--gold)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;color:var(--muted);padding:9px 14px;font:600 .9rem Inter;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--gold2);border-color:var(--gold)}
.panel[hidden]{display:none}
.txt{white-space:pre-line;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px;line-height:1.65}
.h{font:700 .95rem Cinzel;color:var(--gold2);margin:18px 0 8px}
.h:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:500 .82rem Inter;padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg2);color:var(--text)}
.chip.t{border-color:#4a9eff66;background:#4a9eff1f;color:#8cc2ff}
button.chip{cursor:pointer}button.chip:hover{border-color:var(--gold);color:var(--gold2)}
.empty{color:var(--muted);font-style:italic}
.advice{border-left:3px solid var(--gold);background:var(--bg2);padding:12px 16px;border-radius:0 10px 10px 0}
.combo{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:10px}
.combo ol{padding-left:20px;margin-top:6px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;font-size:.88rem}.kv dt{color:var(--muted)}.kv dd{margin:0}
@media(max-width:860px){.bar-in{grid-template-columns:1fr 1fr}.field{grid-column:1/-1}.m{grid-template-columns:1fr;overflow:auto}.side{display:flex;gap:16px;align-items:flex-start}.side img{width:120px}.facts{margin:0;flex:1}.stats{display:none}.body{overflow:visible}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hero">
  <div><h1>YGodex</h1><p>La base de connaissance Yu-Gi-Oh! : trouve une carte, comprends son rôle, découvre ses synergies.</p></div>
  <div class="stats"><div><b id="sCards">–</b><span>cartes</span></div><div><b id="sNotes">–</b><span>fiches rédigées</span></div></div>
</header>

<div class="bar"><div class="bar-in">
  <div class="field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input id="q" type="search" placeholder="Rechercher une carte (nom FR ou EN)…" aria-label="Rechercher une carte"></div>
  <select id="kind" aria-label="Catégorie"><option value="">Toutes catégories</option><option value="monster">Monstres</option><option value="spell">Magies</option><option value="trap">Pièges</option></select>
  <select id="arch" aria-label="Archétype"><option value="">Tous archétypes</option></select>
  <select id="sort" aria-label="Tri"><option value="noted">Fiches d'abord</option><option value="name">Nom A–Z</option><option value="atk">ATK décroissant</option><option value="level">Niveau décroissant</option></select>
  <div class="seg" role="group" aria-label="Langue"><button data-l="fr" aria-pressed="true">FR</button><button data-l="en" aria-pressed="false">EN</button></div>
</div></div>
<div class="tagrow" id="tags" style="padding-top:14px"></div>

<main>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" hidden>Afficher plus de cartes</button>
</main>
<dialog id="dlg"></dialog>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const COL={normal:'#d9b45a',effect:'#d97a3a',ritual:'#4f7fd6',fusion:'#8b4fc4',synchro:'#e6e6e6',xyz:'#5b5f6e',link:'#2a6fb8',spell:'#1f9e8a',trap:'#b3407c',token:'#8a8f9e'};
const colorOf=c=>COL[String(c.frameType||'').split('_')[0]]||'#8b93a8';
const kindOf=c=>c.frameType==='spell'?'spell':c.frameType==='trap'?'trap':'monster';
const PAGE=48;
let BY={},ALL=[],list=[],shown=PAGE,tag=null,lang='fr';
try{lang=localStorage.getItem('ygodex-lang')||'fr'}catch(e){}
const nameOf=c=>(lang==='fr'&&c.name.fr)||c.name.en;
const descOf=c=>(lang==='fr'&&c.desc.fr)||c.desc.en||'—';
const small=u=>u?u.replace('/images/cards/','/images/cards_small/'):'';

function setLang(l){lang=l;try{localStorage.setItem('ygodex-lang',l)}catch(e){}
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));render()}

async function init(){
  $('grid').innerHTML=Array(12).fill('<div class="sk"></div>').join('');
  try{
    const r=await fetch('data/pokedex-db.json');if(!r.ok)throw new Error(r.status);
    BY=(await r.json()).cards;ALL=Object.values(BY);
  }catch(e){
    $('grid').innerHTML='<div class="msg"><h2>Données introuvables</h2>Le fichier <code>data/pokedex-db.json</code> n\'existe pas encore.<br>Lance l\'Action « Build pokedex-db » dans l\'onglet Actions du dépôt, puis recharge la page.</div>';return}
  $('sCards').textContent=ALL.length.toLocaleString('fr');
  $('sNotes').textContent=ALL.filter(c=>c.noted).length;
  const arch={};ALL.forEach(c=>c.archetype&&(arch[c.archetype]=(arch[c.archetype]||0)+1));
  Object.keys(arch).sort((a,b)=>a.localeCompare(b)).forEach(a=>$('arch').add(new Option(`${a} (${arch[a]})`,a)));
  const tc={};ALL.forEach(c=>c.tags.forEach(t=>tc[t]=(tc[t]||0)+1));
  $('tags').innerHTML=Object.keys(tc).sort().map(t=>`<button class="pill" aria-pressed="false" data-t="${esc(t)}">${esc(t)}<i>${tc[t]}</i></button>`).join('');
  $('tags').addEventListener('click',e=>{const b=e.target.closest('.pill');if(!b)return;
    document.querySelectorAll('.pill').forEach(p=>p.setAttribute('aria-pressed','false'));
    tag=tag===b.dataset.t?null:b.dataset.t;if(tag)b.setAttribute('aria-pressed','true');shown=PAGE;render()});
  ['q','kind','arch','sort'].forEach(i=>$(i).addEventListener('input',()=>{shown=PAGE;render()}));
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
  setLang(lang);
  $('more').onclick=()=>{shown+=PAGE;draw()};
  $('grid').addEventListener('click',e=>{const t=e.target.closest('.tile');if(t)openCard(t.dataset.id)});
  const h=location.hash.slice(1);if(BY[h])openCard(h);
}

function render(){
  const q=norm($('q').value.trim()),k=$('kind').value,a=$('arch').value,s=$('sort').value;
  list=ALL.filter(c=>(!k||kindOf(c)===k)&&(!a||c.archetype===a)&&(!tag||c.tags.includes(tag))
    &&(!q||norm(c.name.en).includes(q)||norm(c.name.fr).includes(q)));
  const by={noted:(x,y)=>(y.noted-x.noted)||nameOf(x).localeCompare(nameOf(y)),name:(x,y)=>nameOf(x).localeCompare(nameOf(y)),
    atk:(x,y)=>(y.atk??-1)-(x.atk??-1),level:(x,y)=>(y.level??-1)-(x.level??-1)};
  list.sort(by[s]);draw();
}
function draw(){
  $('count').textContent=`${list.length.toLocaleString('fr')} carte${list.length>1?'s':''}${tag?` · tag « ${tag} »`:''}`;
  $('grid').innerHTML=list.slice(0,shown).map(c=>`<button class="tile${c.noted?' noted':''}" data-id="${c.id}" style="--c:${colorOf(c)}">
    <div class="art"><img src="${esc(small(c.imgFull||c.img))}" alt="" loading="lazy">${c.noted?'<span class="star" title="Fiche rédigée">★</span>':''}</div>
    <b>${esc(nameOf(c))}</b><small>${esc(c.type)}</small></button>`).join('')
    ||'<div class="msg"><h2>Aucune carte trouvée</h2>Essaie un autre nom ou retire un filtre.</div>';
  $('more').hidden=shown>=list.length;
}
const chips=(a,cls='')=>a.length?`<div class="chips">${a.map(t=>`<span class="chip ${cls}">${esc(t)}</span>`).join('')}</div>`:'';
function openCard(id){
  const c=BY[id];if(!c)return;
  const facts=[['Attribut',c.attribute],['Race',c.race],['Niveau',c.level],['ATK',c.atk],['DEF',c.def],['Échelle',c.scale],['Lien',c.linkval]]
    .filter(f=>f[1]!=null&&f[1]!=='').map(f=>`<div><span>${f[0]}</span><b>${esc(f[1])}</b></div>`).join('');
  const syn=c.synergies.filter(s=>BY[s]).map(s=>`<button class="chip" data-open="${s}">${esc(nameOf(BY[s]))}</button>`).join('');
  const kv=[['Passcode',c.id],['Archétype',c.archetype],['Types d\'effet',c.effectTypes.join(', ')],['Statut TCG',c.tcgStatus],['Statut OCG',c.ocgStatus],['Supporte',c.supports.slice(0,15).join(', ')],['Anti-support',c.antiSupports.slice(0,10).join(', ')]]
    .filter(r=>r[1]).map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('');
  $('dlg').innerHTML=`<div class="m" style="--c:${colorOf(c)}">
    <button class="x" aria-label="Fermer" onclick="dlg.close()">✕</button>
    <div class="side"><img src="${esc(c.imgFull||c.img)}" alt="${esc(nameOf(c))}"><div class="facts">${facts}</div></div>
    <div class="body"><h2>${esc(nameOf(c))}</h2><div class="sub">${esc(c.type)}${c.name.fr&&c.name.en&&lang==='fr'?' · '+esc(c.name.en):''}</div>
    <div class="tabs" role="tablist">${['Aperçu','Stratégie','Combos','Données'].map((t,i)=>`<button role="tab" aria-selected="${i===0}" data-tab="${i}">${t}</button>`).join('')}</div>
    <div class="panel" data-p="0"><div class="txt">${esc(descOf(c))}</div>
      <div class="h">Tags</div>${chips(c.tags,'t')||'<span class="empty">Pas encore de tags.</span>'}</div>
    <div class="panel" data-p="1" hidden><div class="h">Comment la jouer</div>${c.howToPlay?`<div class="advice">${esc(c.howToPlay)}</div>`:'<span class="empty">Pas encore de conseil pour cette carte.</span>'}
      <div class="h">Synergies</div>${syn?`<div class="chips">${syn}</div>`:'<span class="empty">Aucune synergie renseignée.</span>'}</div>
    <div class="panel" data-p="2" hidden>${c.combos.length?c.combos.map(k=>`<div class="combo"><b>${esc(k.title)}</b><ol>${k.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`).join(''):'<span class="empty">Aucun combo renseigné pour cette carte.</span>'}</div>
    <div class="panel" data-p="3" hidden><dl class="kv">${kv}</dl></div></div></div>`;
  if(!dlg.open)dlg.showModal();
  history.replaceState(null,'','#'+id);
}
const dlg=$('dlg');
dlg.addEventListener('click',e=>{
  const o=e.target.closest('[data-open]'),t=e.target.closest('[data-tab]');
  if(o)openCard(o.dataset.open);
  else if(t){dlg.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b===t));
    dlg.querySelectorAll('.panel').forEach(p=>p.hidden=p.dataset.p!==t.dataset.tab)}
  else if(e.target===dlg)dlg.close()});
dlg.addEventListener('close',()=>history.replaceState(null,'',location.pathname+location.search));
init();
</script>
</body>
</html>
