name: Build pokedex-db

on:
  push:
    paths:
      - 'data/card-notes.json'
      - 'data/tags.json'
      - 'scripts/**'
  schedule:
    - cron: '0 6 * * 1'      # chaque lundi : récupère les dernières bases de YGO Tools
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run fetch
      - run: npm run validate     # échoue avec un message clair si une note est invalide
      - run: npm run build
      - name: Commit pokedex-db.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pokedex-db.json
          git diff --staged --quiet || git commit -m "Mise à jour de data/pokedex-db.json"
          git push
